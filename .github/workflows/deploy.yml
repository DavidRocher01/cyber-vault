# checkov:skip=CKV2_GHA_1: Actions pinned to major version tags — SHA pinning handled via Dependabot
name: Deploy — Production

on:
  # DECLENCHEMENT MANUEL, ajoute le 2026-08-11. Il permet de valider un
  # changement d INFRASTRUCTURE — droits IAM, groupes de securite — sans
  # inventer une modification de code. Ce fichier etant dans `.github/**`, son
  # propre push ne declenche rien : c est exactement ce qu on veut.
  workflow_dispatch:
  push:
    branches: [main, master]
    # Un changement purement CI/docs (workflows, markdown, docs/) ne doit pas
    # redéployer la prod. paths-ignore ne skippe le run que si TOUS les fichiers
    # du push correspondent — un merge de feature avec du code applicatif déploie
    # normalement (mix ignoré + non-ignoré => run déclenché).
    paths-ignore:
      - ".github/**"
      - "**.md"
      - "docs/**"

permissions:
  id-token: write   # required for OIDC token request
  contents: read

env:
  AWS_REGION: eu-west-3
  ECR_REPOSITORY: cybervault-backend
  # Nom de la CloudFront Function qui aiguille les URL. En clair comme
  # ECR_REPOSITORY : ce n'est pas un secret, et en faire un ajouterait une
  # manipulation a oublier — donc un deploiement qui echoue sans raison.
  CLOUDFRONT_FUNCTION: redirect-cyberscanapp-to-rocher

jobs:
  # ── Backend : ECR → ECS ─────────────────────────────────────────────────────
  deploy-backend:
    name: Backend → ECR + ECS
    runs-on: ubuntu-latest
    outputs:
      # Exposees pour le job `recette` : cible du rollback (revision AVANT ce
      # deploiement) et revision fraichement deployee.
      prev_task_def: ${{ steps.deploy.outputs.prev_task_def }}
      new_task_def: ${{ steps.deploy.outputs.new_task_def }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Build & push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}
        run: |
          docker build -f backend/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push    $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag     $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                         $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push    $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Register task def (new image), run migrations, then deploy
        id: deploy
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}
          SM_ARN: ${{ secrets.AWS_SM_ARN }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          # Parametres de la task def prod centralises (une seule source).
          TASK_CPU: "1024"
          TASK_MEMORY: "2048"
          TASK_ROLE_ARN: "arn:aws:iam::328646895533:role/cybervault-ecs-task-role"
          DELIVERABLES_BUCKET: "cybervault-rssi-deliverables-prod"
        run: |
          set -euo pipefail

          NETWORK_CONFIG=$(aws ecs describe-services             --cluster ${{ secrets.ECS_CLUSTER }}             --services ${{ secrets.ECS_SERVICE }}             --query 'services[0].networkConfiguration'             --output json)

          TASK_DEF_ARN=$(aws ecs describe-services             --cluster ${{ secrets.ECS_CLUSTER }}             --services ${{ secrets.ECS_SERVICE }}             --query 'services[0].taskDefinition'             --output text)

          # Cible du rollback : la revision actuellement en service (AVANT deploy).
          echo "prev_task_def=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

          # New task definition with the freshly built image + Secrets Manager refs
          NEW_TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition' \
            --output json | jq \
              --arg IMAGE     "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
              --arg SM_ARN    "$SM_ARN" \
              --arg PK_LIVE   "$STRIPE_PUBLISHABLE_KEY" \
              --arg BUCKET    "$DELIVERABLES_BUCKET" \
              --arg CPU       "$TASK_CPU" \
              --arg MEM       "$TASK_MEMORY" \
              --arg TASK_ROLE "$TASK_ROLE_ARN" \
              '
               # ATTENTION : ce bloc jq vit dans une chaine shell a guillemets
               # SIMPLES. Une seule apostrophe dans un commentaire la referme et
               # casse le deploiement avec un « syntax error near unexpected
               # token ». Ecrire sans apostrophe (cf. 2026-07-31, ou « avant
               # d etre liste » a fait echouer un deploiement complet).
               #
               # Secrets tires de Secrets Manager (source unique) ; les 2 valeurs
               # non-secretes sont re-injectees en clair. La liste a PURGER derive
               # de ces deux listes -> plus de triple maintenance manuelle.
               #
               # ORIGIN_VERIFY_SECRET (2026-07-31, lot S2 action B1) : active le
               # garde applicatif de _get_real_ip. Sans lui le code est un no-op.
               # Il DOIT exister dans Secrets Manager avant sa mise en liste ici,
               # sinon la task ECS refuse de demarrer.
               #
               # ADMIN_API_KEY : bascule TERMINEE. Retiree de cette liste le
               # 2026-08-02, code du repli supprime le 2026-08-03 (backend et
               # frontend), secret supprime de Secrets Manager et verifie le
               # meme jour. Le back-office s ouvre par un compte users.is_admin
               # protege par 2FA. Ne rien remettre ici.
               #
               # L ordre suivi est la seule raison pour laquelle le back-office
               # n a jamais ete inaccessible : retirer de la liste D ABORD,
               # supprimer le secret ENSUITE. L inverse empeche la task de
               # demarrer, puisqu elle reclame un secret qui n existe plus.
               # PHISHING_FROM_EMAIL n est PAS un secret — c est une adresse.
               # Il vit tout de meme dans Secrets Manager, et c est deliberé :
               # en changer la valeur devient alors une edition de champ suivie
               # d un redemarrage force, sans commit, sans CI, sans relecture.
               # Le mettre en dur ici imposerait un passage complet du pipeline
               # a chaque changement de domaine d expedition.
               # Il EXISTE deja dans le secret (verifie le 2026-08-03) : l ajouter
               # a cette liste ne peut donc pas empecher la task de demarrer.
               (["SECRET_KEY","DATABASE_URL","STRIPE_SECRET_KEY","STRIPE_WEBHOOK_SECRET","SMTP_PASSWORD","RESEND_API_KEY","SENTRY_DSN","ORIGIN_VERIFY_SECRET","PHISHING_FROM_EMAIL"]) as $secret_names
               # ANTIVIRUS_DEPOT_ACTIF : arme ici, et ICI SEULEMENT.
               #
               # Le defaut de classe reste FAUX pour que le developpement et les
               # tests ne dependent pas d un bucket S3. Sans S3 il n y a pas de
               # balise a relire : a vrai, chaque depot resterait en `en_analyse`
               # jusqu au renoncement, et plus rien ne serait telechargeable.
               #
               # A vrai en production, un depot attend son verdict avant d etre
               # delivre — 20 a 45 s de scan, plus l intervalle de 2 min de la
               # tache de relecture. Les fichiers deja deposes ne sont pas
               # concernes : ils portent deja `sain`.
               #
               # PREREQUIS, tous verifies le 2026-08-05 : plan GuardDuty ACTIVE
               # sur le bucket, balisage ENABLED, detection confirmee par un test
               # EICAR, et tache `depot_rafraichir_analyses` presente dans
               # l image deployee. Armer sans l un d eux bloque les
               # telechargements sans qu aucune alerte ne se declenche.
               | ([{"name":"STRIPE_PUBLISHABLE_KEY","value":$PK_LIVE},{"name":"S3_BUCKET_NAME","value":$BUCKET},{"name":"TRUSTED_PROXY_COUNT","value":"2"},{"name":"ANTIVIRUS_DEPOT_ACTIF","value":"true"}]) as $env_overrides
               | (($env_overrides | map(.name)) + $secret_names) as $managed
               | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
               | .cpu = $CPU
               | .memory = $MEM
               | .taskRoleArn = $TASK_ROLE
               | .containerDefinitions[0].image = $IMAGE
               | .containerDefinitions[0].environment = (
                   ((.containerDefinitions[0].environment // []) | map(select(.name as $n | ($managed | index($n)) == null)))
                   + $env_overrides
                 )
               | .containerDefinitions[0].secrets = ($secret_names | map({"name": ., "valueFrom": ($SM_ARN + ":" + . + "::")}))
              ')

          # Register the new revision FIRST so migrations run with the NEW image
          NEW_ARN=$(aws ecs register-task-definition             --cli-input-json "$NEW_TASK_DEF"             --query 'taskDefinition.taskDefinitionArn'             --output text)
          echo "New task definition: $NEW_ARN"
          echo "new_task_def=$NEW_ARN" >> "$GITHUB_OUTPUT"

          # Run Alembic migrations one-shot using the NEW image
          TASK_ARN=$(aws ecs run-task             --cluster ${{ secrets.ECS_CLUSTER }}             --task-definition "$NEW_ARN"             --launch-type FARGATE             --network-configuration "$NETWORK_CONFIG"             --overrides '{"containerOverrides":[{"name":"cybervault-backend","command":["python","-m","alembic","upgrade","head"]}]}'             --query 'tasks[0].taskArn'             --output text)
          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster ${{ secrets.ECS_CLUSTER }} --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks             --cluster ${{ secrets.ECS_CLUSTER }}             --tasks "$TASK_ARN"             --query 'tasks[0].containers[0].exitCode'             --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed with exit code $EXIT_CODE"
            exit 1
          fi

          # Migrations OK -> point the service at the new revision
          aws ecs update-service             --cluster ${{ secrets.ECS_CLUSTER }}             --service ${{ secrets.ECS_SERVICE }}             --task-definition "$NEW_ARN"

          # Attendre la stabilisation ET verifier que le service tourne bien la NOUVELLE
          # revision : le circuit breaker ECS rollback silencieusement si le conteneur crashe,
          # et update-service rend la main immediatement (d'ou les faux succes passes).
          echo "Attente de la stabilisation du service ECS..."
          aws ecs wait services-stable --cluster ${{ secrets.ECS_CLUSTER }} --services ${{ secrets.ECS_SERVICE }} || true
          RUNNING=$(aws ecs describe-services --cluster ${{ secrets.ECS_CLUSTER }} --services ${{ secrets.ECS_SERVICE }} --query 'services[0].taskDefinition' --output text)
          if [ "$RUNNING" != "$NEW_ARN" ]; then
            echo "::error::Deploiement ECHOUE (rollback) : le service tourne $RUNNING au lieu de $NEW_ARN. Voir CloudWatch /ecs/cybervault-backend."
            exit 1
          fi
          echo "Deploiement stable sur $NEW_ARN"

  # ── Frontend : S3 + CloudFront ──────────────────────────────────────────────
  deploy-frontend:
    name: Frontend → S3 + CloudFront
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build (production)
        run: npm ci --legacy-peer-deps && npm run build -- --configuration=production
        working-directory: frontend

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}
      # Le prerendu produit un index.html PAR PAGE. Lexclusion ne peut donc pas
      # viser le seul fichier racine : `--exclude "index.html"` ne correspond
      # qua la racine, et les autres auraient herite dun cache immuable dun an.
      #
      # PLUS DE `--delete`, ET CEST DELIBERE. Deux raisons :
      #
      #   1. Le retour arriere en depend. Remettre les HTML precedents ne sert a
      #      rien si les assets quils referencent ont ete effaces.
      #   2. Cetait la CAUSE des onglets perimes. Un onglet ouvert pendant un
      #      deploiement demandait des morceaux que `--delete` venait de
      #      supprimer : la navigation echouait en silence et le clic paraissait
      #      mort. Un garde-fou avait ete pose cote navigateur le 2026-08-07 ;
      #      ceci supprime la cause plutot que le symptome.
      #
      # Les assets portent leur empreinte dans leur nom : ils ne peuvent pas se
      # marcher dessus. Le contre-coup est une accumulation lente dans le seau —
      # negligeable a cette echelle, a revoir si elle devient visible.
      #
      # Une page HTML devenue obsolete ne peut pas etre servie par accident : la
      # Function CloudFront decide seule des chemins prerendus, et elle est
      # regeneree a chaque deploiement depuis linventaire du build.
      # RELEVE DE LA VERSION EN PLACE, AVANT DE LA REMPLACER.
      #
      # Jusquau 2026-08-10 le frontend netait PAS repris en cas dechec de la
      # recette : le sync avait deja remplace les fichiers. Deux fois dans la
      # meme journee jai du reparer la production a la main — republier une
      # Function CloudFront neutre, puis revenir sur le lot. Ce releve rend
      # cette reparation automatique.
      #
      # On ne releve que le HTML et la Function : les assets, eux, portent leur
      # empreinte dans leur nom et SURVIVENT (voir letape suivante).
      - name: Relever la version en place (pour un retour arriere possible)
        run: |
          mkdir -p sauvegarde-frontend
          aws s3 sync s3://${{ secrets.S3_BUCKET_NAME }}/ sauvegarde-frontend/ --exclude "*" --include "*.html"
          aws cloudfront get-function --name ${{ env.CLOUDFRONT_FUNCTION }} --stage LIVE sauvegarde-frontend/routage-precedent.js

      - name: Conserver la version precedente
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-precedent
          path: sauvegarde-frontend/
          retention-days: 5

      - name: Sync assets (cache long terme — hash dans le nom de fichier)
        run: |
          aws s3 sync frontend/dist/cyber-vault-frontend/browser/             s3://${{ secrets.S3_BUCKET_NAME }}/             --exclude "*.html"             --cache-control "public, max-age=31536000, immutable"

      - name: Upload des pages HTML (pas de cache)
        run: |
          aws s3 sync frontend/dist/cyber-vault-frontend/browser/             s3://${{ secrets.S3_BUCKET_NAME }}/             --exclude "*"             --include "*.html"             --cache-control "no-cache, no-store, must-revalidate"

      # ROUTAGE CDN — APRES la synchro, jamais avant.
      #
      # La fonction aiguille `/nis2` vers `/nis2/index.html`. La publier avant que
      # le fichier ne soit en place ferait servir du vide. L'ordre est la seule
      # garantie ici : le rollback automatique ne couvre pas le frontend.
      #
      # La liste des routes est DERIVEE de `prerendered-routes.json`, l'inventaire
      # emis par la construction. Le script refuse de generer une fonction a
      # partir d'un inventaire quasi vide : ce serait le signe que le prerendu
      # s'est eteint, et publier ferait taire le symptome.
      - name: Générer la fonction de routage depuis l'inventaire du build
        working-directory: frontend
        run: node --experimental-strip-types scripts/generer-routage-cloudfront.ts

      - name: Publier la fonction de routage CloudFront
        run: |
          ETAG=$(aws cloudfront describe-function             --name ${{ env.CLOUDFRONT_FUNCTION }} --query 'ETag' --output text)

          ETAG=$(aws cloudfront update-function             --name ${{ env.CLOUDFRONT_FUNCTION }}             --if-match "$ETAG"             --function-config '{"Comment":"Routage SPA + pages prerendues","Runtime":"cloudfront-js-2.0"}'             --function-code fileb://frontend/dist/routage-cloudfront.js             --query 'ETag' --output text)

          aws cloudfront publish-function             --name ${{ env.CLOUDFRONT_FUNCTION }} --if-match "$ETAG"

      # NOTE — le routage SPA ne passe PLUS par les CustomErrorResponses.
      #
      # Cette etape posait, a chaque deploiement :
      #   403 -> /index.html (200)   et   404 -> /index.html (200)
      # Or les CustomErrorResponses sont GLOBALES a la distribution : elles
      # s'appliquaient donc aussi aux comportements /api/* (origine ALB), et
      # transformaient tous les 403/404 de l'API en "200 + index.html". Un client
      # d'API (ou le front lui-meme) recevait du HTML avec un code 200 au lieu d'un
      # vrai 404/403 JSON.
      #
      # Le routage SPA est desormais assure par la CloudFront Function
      # `redirect-cyberscanapp-to-rocher` (viewer-request, attachee au comportement
      # par defaut uniquement) : elle reecrit vers /index.html les chemins sans
      # extension de fichier, et laisse /api/* intact. L'API renvoie donc ses vrais
      # codes. Ne pas reintroduire de CustomErrorResponses ici.

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  # ── Recette post-prod : gate fonctionnel + rollback ECS auto ────────────────
  # Tourne APRES que le backend et le frontend soient deployes et stables. Valide
  # de vrais parcours (auth, coffre, scan, UI) contre la PROD avec un compte
  # canari dedie. Si la recette echoue -> rollback automatique du backend vers la
  # task def precedente.
  #
  # IMPORTANT — le rollback ne concerne QUE le backend (task def ECS) :
  #   * Il ne rejoue PAS les migrations a l'envers (le downgrade DB n'est jamais
  #     execute en prod). Les migrations DOIVENT donc rester retro-compatibles :
  #     l'image precedente doit tourner contre le schema deja migre (expand puis
  #     contract sur un deploiement ULTERIEUR). Une migration destructive-immediate
  #     casserait le rollback.
  #   * Il rollback AUSSI le frontend depuis le 2026-08-10 : les pages HTML et
  #     la Function CloudFront sont relevees avant la synchro, et remises en cas
  #     d'echec. C'est possible parce que la synchro des assets ne fait plus de
  #     `--delete` : les fichiers haches de la version precedente survivent.
  recette:
    name: Recette post-prod (gate + rollback)
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      RECETTE_BASE_URL: ${{ secrets.RECETTE_BASE_URL }}
      RECETTE_EMAIL:    ${{ secrets.RECETTE_EMAIL }}
      RECETTE_PASSWORD: ${{ secrets.RECETTE_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install recette deps
        run: pip install -r backend/recette/requirements.txt

      - name: Recette API (auth, coffre, scan, cleanup)
        run: python -m pytest recette/ -c recette/pytest.ini
        working-directory: backend

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps + Playwright
        run: npm ci --legacy-peer-deps && npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Recette UI (Playwright vs prod)
        # LE DEPOT DE PIECE EST DE NOUVEAU BLOQUANT, apres rodage.
        #
        # Ce parcours a tourne en `continue-on-error` le temps de faire ses
        # preuves, parce qu'un garde-fou qui n'a JAMAIS reussi ne peut pas etre
        # cru quand il echoue : livre bloquant d'emblee, il avait fait revenir
        # en arriere un deploiement sain — il deposait un `.txt`, refuse en 422
        # par la liste blanche de types. Le produit allait bien ; la recette
        # avait tort.
        #
        # Il est passe en production le 2026-08-10 (7,5 s : ecriture S3, verdict
        # GuardDuty, retrait). Il a donc gagne le droit de bloquer.
        run: npx playwright test --config=playwright.recette.config.ts
        working-directory: frontend

      # RETOUR ARRIERE DU FRONTEND — nouveau depuis le 2026-08-10.
      #
      # Il precede volontairement le rollback ECS : cest le frontend que le
      # visiteur voit, et cest lui qui restait casse jusquici. Deux fois dans la
      # meme journee jai du le reparer a la main.
      #
      # On remet les HTML releves avant la synchro, PUIS on republie la Function
      # qui allait avec. Jamais linverse : publier une Function qui pointe vers
      # des pages pas encore restaurees ferait servir du vide, exactement comme
      # publier avant la synchro a laller.
      - name: Retour arriere du frontend si la recette echoue
        if: failure()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-precedent
          path: sauvegarde-frontend/

      - name: Remettre les pages et le routage precedents
        if: failure()
        run: |
          aws s3 sync sauvegarde-frontend/ s3://${{ secrets.S3_BUCKET_NAME }}/ --exclude "*" --include "*.html" --cache-control "no-cache, no-store, must-revalidate"

          ETAG=$(aws cloudfront describe-function --name ${{ env.CLOUDFRONT_FUNCTION }} --query 'ETag' --output text)
          ETAG=$(aws cloudfront update-function --name ${{ env.CLOUDFRONT_FUNCTION }} --if-match "$ETAG" --function-config '{"Comment":"Routage SPA (retour arriere recette)","Runtime":"cloudfront-js-2.0"}' --function-code fileb://sauvegarde-frontend/routage-precedent.js --query 'ETag' --output text)
          aws cloudfront publish-function --name ${{ env.CLOUDFRONT_FUNCTION }} --if-match "$ETAG"

          echo "Frontend revenu a la version precedente."

      - name: Rollback ECS si la recette echoue
        if: failure()
        env:
          PREV: ${{ needs.deploy-backend.outputs.prev_task_def }}
        run: |
          set -euo pipefail
          if [ -z "${PREV:-}" ] || [ "$PREV" = "None" ]; then
            echo "::error::Recette KO mais task def precedente inconnue — rollback impossible, intervention manuelle requise (voir CloudWatch /ecs/cybervault-backend)."
            exit 1
          fi
          echo "::warning::Recette post-prod ECHOUEE -> rollback ECS backend vers $PREV"
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.ECS_SERVICE }} \
            --task-definition "$PREV"
          aws ecs wait services-stable \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --services ${{ secrets.ECS_SERVICE }} || true
          RUNNING=$(aws ecs describe-services \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --services ${{ secrets.ECS_SERVICE }} \
            --query 'services[0].taskDefinition' --output text)
          echo "::error::Recette echouee. Backend rollback vers $RUNNING. Le frontend (S3/CloudFront) N'EST PAS rollback automatiquement — verifier et redeployer si besoin."
          exit 1
