# checkov:skip=CKV2_GHA_1: Actions pinned to major version tags — SHA pinning handled via Dependabot
name: CI

on:
  push:
    branches: [main, master, develop]
    # Un commit qui ne touche que de la doc n'a rien a faire tester (~32 min de
    # runner economisees a chaque fois). Le code, les workflows et les deps
    # declenchent toujours la CI.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
  pull_request:
    branches: [main, master, develop]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cybervault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: "pip"
          # Les deux fichiers comptent : requirements.txt tire requirements.prod.txt.
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        # requirements.txt = `-r requirements.prod.txt` (runtime EXACT de la prod)
        # + les outils de dev/test EPINGLES. On installe donc ici exactement ce que
        # le venv local a. Auparavant la liste etait ecrite a la main et NON epinglee
        # (pytest, ruff, mypy... en derniere version) : la CI divergeait du local et
        # pouvait casser toute seule a la sortie d'une nouvelle version d'outil.
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: backend

      - name: Cohérence des runtimes (Python/Node déclarés partout pareil)
        # Attrape une image Docker ou un engines.node qui repart de son côté, et
        # tout ré-épinglage en dur dans un workflow. Sans ce garde-fou, le poste
        # de dev a tourné en Python 3.12 pendant que la prod était en 3.14.
        run: python scripts/check_runtime_versions.py

      - name: Syntaxe shell des workflows
        # Le 2026-07-31, une apostrophe dans un commentaire du programme jq de
        # deploy.yml a referme la chaine shell qui l'entoure et fait echouer un
        # deploiement de production — le job frontend etant deja passe, la prod
        # s'est retrouvee avec un frontend a jour devant un backend inchange.
        # Rien ne testait les workflows : l'erreur ne se voyait qu'a l'execution.
        run: python scripts/check_workflow_shell.py

      - name: Ruff (lint)
        run: ruff check app/
        working-directory: backend

      - name: Mypy (typage statique)
        run: mypy app/
        working-directory: backend

      - name: Bandit (sécurité statique)
        run: bandit -r app/ -ll
        working-directory: backend

      - name: pip-audit (vulnérabilités)
        # Objectif : ZÉRO CVE ignorée. Chaîne python-jose/pyasn1 supprimée (migration
        # vers PyJWT) et starlette/fastapi remontés (fastapi 0.138.1 / starlette 1.3.1)
        # → les 9 CVE précédemment ignorées sont corrigées.
        run: pip-audit
        working-directory: backend

      - name: Validate awareness content (YAML + Markdown)
        run: python scripts/validate_awareness_content.py
        working-directory: backend

      - name: Catalogue de sensibilisation à jour
        # Le frontend importe des chiffres derives de content/fr/ (nombre de
        # modules, durees, parcours). Sans ce garde-fou, ajouter un module sans
        # regenerer laisse le site annoncer l'ancien catalogue — c'est ce qui a
        # produit « 17 modules » affiches pour 28 reels.
        run: python scripts/generate_awareness_catalog.py --check
        working-directory: backend

      - name: Schémas d'architecture synchronisés
        # Les 9 .mmd derivent des blocs mermaid d'ARCHITECTURE.md. Ils avaient
        # ete extraits une fois puis jamais regeneres : le 2026-08-02, 02.mmd
        # decrivait encore un frontend « Angular 20 » corrige en 21 dans la
        # source. Aucun lien ne pointe vers ces fichiers, donc personne ne les
        # rouvre — seul un controle peut le voir.
        run: python scripts/generate_diagrams.py --check

      - name: Tarifs retirés encore affichés
        # Aucun env : `app.core.pricing` n'importe que la grille, jamais
        # `Settings`. Verifie hors du projet, sans .env — c'est exactement ce
        # masquage-la qui avait fait echouer l'etape PDF a son premier passage.
        # La grille a change trois fois en 2026. A chaque fois des montants sont
        # restes ecrits en dur dans des pages que personne ne rouvrait : le
        # 2026-08-01, cinq surfaces annoncaient encore des prix perimes, dont un
        # article intitule « combien ca coute vraiment » affichant 9,90 EUR pour
        # un abonnement facture 49. Le code etait juste, c'est la copie qui
        # mentait — aucun test ne pouvait le voir.
        run: python scripts/check_prix_retires.py
        working-directory: backend

      - name: Lisibilité des PDF (texte invisible, chevauchements)
        env:
          # Plusieurs generateurs importent `Settings`, qui exige ces deux
          # champs. En local un .env les fournit, pas sur un runner : sans eux,
          # six echantillons sur douze echouent a l'import. Memes valeurs
          # factices que l'etape Alembic ci-dessous ; aucune base n'est touchee.
          SECRET_KEY: ci-test-secret-key
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/cybervault_test
        # Aucun test ne REGARDAIT un PDF : ils verifiaient qu'il est produit,
        # jamais qu'il est lisible. Le 2026-07-31 la bascule en thema clair a
        # rendu le rapport de phishing a moitie illisible — en-tetes, domaine,
        # plan et dates ecrits en blanc sur blanc — pendant que 1454 tests
        # restaient verts. Du blanc sur blanc s'extrait parfaitement : seul le
        # rendu le montre.
        #
        # pypdfium2 et pillow ne sont PAS des dependances du projet, seulement
        # de ce controle : installes ici, jamais embarques dans l'image.
        run: |
          pip install --quiet pypdfium2 pillow
          python scripts/preview_pdfs.py
          python scripts/check_pdf_lisibilite.py
        working-directory: backend

      - name: Alembic migrations (up + down + up + check)
        env:
          SECRET_KEY: ci-test-secret-key
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/cybervault_test
        # Applique toute la chaîne depuis zéro, puis teste la réversibilité de la dernière
        # migration (downgrade -1) et sa ré-application. Attrape une migration non réversible
        # AVANT qu'elle ne casse un déploiement (le deploy joue `alembic upgrade head`).
        #
        # `alembic check` ferme un angle mort que les tests ne peuvent PAS voir.
        # La suite construit son schéma avec `Base.metadata.create_all`, donc
        # depuis les MODÈLES ; la production, elle, l'obtient des MIGRATIONS.
        # Rien ne comparait les deux.
        #
        # Concrètement : une migration oubliée ou incomplète laissait les 2514
        # tests au vert — ils n'utilisent pas les migrations — et cette étape au
        # vert aussi, puisque la chaîne s'applique très bien. Seule la production
        # gardait l'ancien schéma. C'est passé près le 2026-08-04 avec le
        # correctif SET NULL du registre de dépôts.
        #
        # Vérifié en ajoutant un champ à un modèle sans migration : `check`
        # échoue en nommant la colonne, les tests passent quand même.
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade -1
          python -m alembic upgrade head
          python -m alembic check
        working-directory: backend

      - name: Pytest + couverture
        env:
          SECRET_KEY: ci-test-secret-key
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/cybervault_test
          # Le lancement d'une campagne de phishing refuse d'envoyer si les
          # simulations partiraient du domaine transactionnel — repli silencieux
          # de `PHISHING_FROM_EMAIL or RESEND_FROM` quand la valeur est absente.
          # Sans .env, un runner tomberait justement dans ce cas et les tests de
          # lancement recevraient 409 au lieu de 202.
          # On pose donc un couple VALIDE plutot que de desactiver la garde en
          # test : la CI exerce ainsi le vrai chemin de production. Domaine
          # factice et distinct du defaut de RESEND_FROM ; aucun mail n'est
          # envoye, le SDK Resend est mocke.
          PHISHING_FROM_EMAIL: no-reply@simulation-ci.invalid
        run: |
          set -o pipefail
          mkdir -p ../test-results
          # `-n auto` : la suite etait strictement sequentielle, et sa preparation
          # domine — ~0,28 s par test, dont 88,9 ms de creation de moteur et
          # 138,3 ms de TRUNCATE (53 tables), mesure. Les corps de test
          # n'apparaissent meme pas au classement des durees.
          # Mesure locale sur 8 coeurs : 17 min 14 -> 5 min 27, couverture
          # comprise et inchangee (94 %).
          #
          # Chaque worker etant un PROCESSUS distinct, il demarre son propre
          # conteneur PostgreSQL : l'isolation est acquise sans decoupage de
          # bases. Volontairement PAS dans addopts — lancer un seul fichier en
          # local demarrerait alors autant de conteneurs que de coeurs.
          #
          # `--dist loadfile` et non le `load` par defaut : les tests d'un meme
          # fichier restent sur le MEME worker, donc dans leur ordre d'ecriture.
          # `load` les eparpille, ce qui reveillerait de facon INTERMITTENTE
          # toute dependance d'un test envers l'etat laisse par un precedent —
          # le pire mode de defaillance, parce qu'il ne se reproduit pas.
          # Le cout est une repartition un peu moins equilibree ; avec ~90
          # fichiers pour 4 coeurs, il est negligeable.
          pytest tests/ --tb=short -n auto --dist loadfile \
            --cov-report=json:../coverage.json \
            --cov-report=html:../coverage-html \
            --junit-xml=../test-results/backend-junit.xml \
            2>&1 | tee ../test-results/backend-verbose.txt
        working-directory: backend

      - name: Résumé couverture
        if: always()
        run: |
          if [ -f coverage.json ]; then
            TOTAL=$(python -c "import json; d=json.load(open('coverage.json')); print(round(d['totals']['percent_covered']))")
            COLOR=$(python -c "t=$TOTAL; print('brightgreen' if t>=90 else 'yellow' if t>=70 else 'red')")
            echo "### 📊 Couverture de code : **${TOTAL}%**" >> $GITHUB_STEP_SUMMARY
            echo "![coverage](https://img.shields.io/badge/coverage-${TOTAL}%25-${COLOR})" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-results
          path: |
            test-results/backend-junit.xml
            test-results/backend-verbose.txt

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage-html/
          retention-days: 30

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: npm audit (CVE deps prod — gate high)
        run: npm audit --audit-level=high --omit=dev
        working-directory: frontend

      - name: ESLint
        run: npm run lint
        working-directory: frontend

      - name: Vitest (tests unitaires + couverture)
        run: npm run test:coverage
        working-directory: frontend

      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-test-results
          path: frontend/test-results/results.xml

      - name: Build
        run: npm run build
        working-directory: frontend

  # ── Rapport de tests PDF ────────────────────────────────────────────────────
  test-report:
    name: Rapport de tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download backend results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: backend-test-results
          path: test-results
        continue-on-error: true

      - name: Download frontend results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-test-results
          path: test-results
        continue-on-error: true

      - name: Parse results and write summary
        run: |
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" frontend/src/app/core/version.ts || echo "?")
          DATE=$(date +%Y-%m-%d)

          if [ -f test-results/backend-junit.xml ]; then
            BE_TESTS=$(grep -oP 'tests="\K[^"]+' test-results/backend-junit.xml | head -1 || echo "?")
            BE_FAIL=$(grep -oP 'failures="\K[^"]+' test-results/backend-junit.xml | head -1 || echo "0")
            BE_ERR=$(grep -oP 'errors="\K[^"]+' test-results/backend-junit.xml | head -1 || echo "0")
            BE_SKIP=$(grep -oP 'skipped="\K[^"]+' test-results/backend-junit.xml | head -1 || echo "0")
            BE_PASS=$(( ${BE_TESTS:-0} - ${BE_FAIL:-0} - ${BE_ERR:-0} - ${BE_SKIP:-0} ))
            BE_STATUS=$([ "$BE_FAIL" = "0" ] && [ "$BE_ERR" = "0" ] && echo "✅" || echo "❌")
          else
            BE_TESTS="?" BE_PASS="?" BE_FAIL="?" BE_STATUS="⚠️"
          fi

          if [ -f test-results/results.xml ]; then
            FE_TESTS=$(grep -oP 'tests="\K[^"]+' test-results/results.xml | head -1 || echo "?")
            FE_FAIL=$(grep -oP 'failures="\K[^"]+' test-results/results.xml | head -1 || echo "0")
            FE_PASS=$(( ${FE_TESTS:-0} - ${FE_FAIL:-0} ))
            FE_STATUS=$([ "$FE_FAIL" = "0" ] && echo "✅" || echo "❌")
          else
            FE_TESTS="?" FE_PASS="?" FE_FAIL="?" FE_STATUS="⚠️"
          fi

          TOTAL_TESTS=$(( ${BE_TESTS:-0} + ${FE_TESTS:-0} ))
          TOTAL_PASS=$(( ${BE_PASS:-0} + ${FE_PASS:-0} ))
          TOTAL_FAIL=$(( ${BE_FAIL:-0} + ${FE_FAIL:-0} ))
          GLOBAL=$([ "$TOTAL_FAIL" = "0" ] && echo "✅ SUCCÈS" || echo "❌ ÉCHEC")

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🧪 Rapport de tests — v${VERSION} (${DATE})

          **Résultat global : ${GLOBAL}**

          | Composant | Tests | Réussis | Échoués | Statut |
          |-----------|------:|--------:|--------:|:------:|
          | Backend (pytest) | ${BE_TESTS} | ${BE_PASS} | ${BE_FAIL} | ${BE_STATUS} |
          | Frontend (Vitest) | ${FE_TESTS} | ${FE_PASS} | ${FE_FAIL} | ${FE_STATUS} |
          | **Total** | **${TOTAL_TESTS}** | **${TOTAL_PASS}** | **${TOTAL_FAIL}** | ${GLOBAL%% *} |

          > Artifacts disponibles : \`backend-test-results\` · \`frontend-test-results\` · \`test-report-pdf\`
          EOF

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install reportlab
        run: pip install reportlab

      - name: Generate PDF test report
        run: |
          python backend/scripts/build_report_from_output.py \
            test-results/backend-verbose.txt \
            test-results/test-report.pdf
        continue-on-error: true

      - name: Upload PDF report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report-pdf
          path: test-results/test-report.pdf
          retention-days: 90

  # ── E2E Playwright ──────────────────────────────────────────────────────────
  e2e:
    name: E2E Playwright
    runs-on: ubuntu-latest
    # UN SEUL JOB — le decoupage en 2 shards a ete essaye puis retire le
    # 2026-08-03, mesures a l'appui (runs 30795421333 et 30796526002).
    #
    # Playwright repartit les tests par FICHIER et non par duree. Nos specs
    # etant de tailles tres inegales, la coupe est tombee a 314 s contre 83 s.
    # Le shard lourd faisait 7 min 23 la ou le job unique fait 7 min 57 : trente
    # secondes gagnees pour le double de minutes CI.
    #
    # Et surtout, equilibrer n'y changerait rien : le job backend tient 7 min 37
    # (dont 361 s de pytest) et plafonne le pipeline. Meme a 200 s par shard,
    # l'ensemble resterait a ~8 min 30. Tant que le backend est le chemin
    # critique, decouper l'E2E ne peut rien rapporter.
    #
    # Ce qui est GARDE de cette tentative : le cache des navigateurs plus bas,
    # qui manquait deja avant et qui, lui, paie dans tous les cas.
    #
    # Aucun `needs` : ce job monte son PROPRE PostgreSQL, installe ses propres
    # dependances et build le front lui-meme — il ne consomme aucun artefact des
    # autres jobs. Il attendait pourtant la fin du backend, et demarrait trois
    # secondes apres : 8 minutes de mur ajoutees pour rien.
    #
    # Le pipeline passe ainsi de ~21 min a ~13 min, sans toucher a un seul test.
    # `test-report` continue d'attendre backend + frontend, lui en a besoin.
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cybervault
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: "pip"
          cache-dependency-path: backend/requirements.prod.txt

      - name: Install backend dependencies
        run: pip install -r requirements.prod.txt
        working-directory: backend

      - name: Run Alembic migrations
        env:
          SECRET_KEY: ci-test-secret-key
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/cybervault
        run: python -m alembic upgrade head
        working-directory: backend

      - name: Start backend
        env:
          SECRET_KEY: ci-test-secret-key
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/cybervault
          ALLOWED_ORIGINS: '["http://localhost:4200"]'
          # MEME RAISON QUE DANS LE JOB BACKEND, et l'oubli ici a coute un run :
          # le lancement de campagne refuse d'envoyer si les simulations
          # partiraient du domaine transactionnel. Sans cette variable, l'E2E
          # `launch — campagne passe au statut sending` recoit 409 et la page ne
          # navigue jamais.
          # Le backend est demarré à DEUX endroits dans cette CI (ici pour l'E2E,
          # et via pytest dans le job Backend) : toute variable qui conditionne
          # un comportement doit être posée aux DEUX.
          PHISHING_FROM_EMAIL: no-reply@simulation-ci.invalid
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn.log 2>&1 &
          echo $! > /tmp/uvicorn.pid
          echo "uvicorn started (PID $(cat /tmp/uvicorn.pid))"
        working-directory: backend

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend on :8000..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend ready after $((i * 2))s"
              exit 0
            fi
            echo "  attempt $i/30..."
            sleep 2
          done
          echo "Backend did not start after 60s — uvicorn logs:"
          cat /tmp/uvicorn.log || echo "(no log file)"
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # Sans cache, cette etape telecharge Chromium a chaque run : 24 s en
      # temps normal, mais 255 s mesurees sur le run 30795421333. J'avais
      # attribue ce pic a deux shards telechargeant en parallele ; le run
      # suivant l'a dementi (21 et 24 s pour les deux shards, cache vide). Le
      # pic etait donc un alea reseau, pas une contention.
      #
      # Le cache reste justifie pour cette raison meme : il supprime une etape
      # dont la duree n'est pas maitrisee.
      #
      # La cle porte sur le lock du frontend : une montee de Playwright change
      # le lock et invalide le cache, sinon on servirait un navigateur
      # incompatible avec le binaire de test.
      - name: Cache des navigateurs Playwright
        id: cache-playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        # `--with-deps` installe des paquets systeme APT, hors du cache : on ne
        # le passe que sur un cache manquant. Sinon seul le navigateur est
        # verifie, ce qui est immediat quand il est deja la.
        run: |
          if [ "${{ steps.cache-playwright.outputs.cache-hit }}" = "true" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi
        working-directory: frontend

      - name: Playwright tests
        run: npx playwright test
        working-directory: frontend

      # L'etape ci-dessus tape `ng serve`, donc la configuration `development`.
      # Celle-ci construit en PRODUCTION et sert le resultat en statique.
      #
      # POURQUOI LES DEUX. Le prerendu du lot 2 n'etait declare que dans
      # `production` : la suite ci-dessus ne pouvait PAS voir la regression de
      # connexion qu'il introduisait, et c'est la recette post-prod qui l'a
      # attrapee — une fois en production. Verifie en rallumant le prerendu :
      # les deux tests de saisie tombent sur `unexpected value "disabled"`.
      #
      # Elle est courte (7 tests) et ne redouble pas la couverture
      # fonctionnelle : elle ne garde que ce qui depend de la configuration
      # livree. Elle coute un build de production, pas davantage.
      - name: Playwright — build de production servi en statique
        run: npm run test:e2e:build
        working-directory: frontend

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
