# Sans cette ligne, un hook qui ne declare pas ses etapes tourne a TOUTES les
# etapes installees — ici `pre-commit` ET `commit-msg`. Chaque commit rejouait
# donc les dix hooks une seconde fois, avec pour seul fichier
# `.git/COMMIT_EDITMSG` : tous ceux qui portent un filtre `files:` affichaient
# alors « no files to check ».
#
# Cout reel : du temps perdu a chaque commit, et surtout une sortie trompeuse —
# le 2026-08-03 elle m'a fait conclure a tort que mypy ne verifiait plus rien.
# Le hook Conventional Commit garde son `stages: [commit-msg]` explicite.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
        # cyber-scanner/tests contient des clés de test intentionnelles
        exclude: ^cyber-scanner/tests/
      - id: check-added-large-files
        args: ["--maxkb=500"]

  # Secrets detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # Python: ruff (lint + format — remplace black + isort)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Python: type checking (mode progressif — erreurs critiques uniquement)
  #
  # `language: system` — le hook utilise le mypy du venv du projet, PAS un
  # environnement isole que pre-commit installerait lui-meme.
  #
  # Pourquoi : le mypy des roues officielles embarque une extension compilee par
  # mypyc, non signee, que Smart App Control bloque sur ce poste (constate le
  # 2026-08-03 sur le venv, puis le 2026-08-04 sur le cache pre-commit —
  # ImportError: DLL load failed while importing fscache). Le venv du projet
  # porte une version PURE PYTHON, installee exprès, qui n a rien a bloquer.
  # Sans cela le hook echoue et aucun commit ne passe.
  #
  # Contrepartie assumee : la version de mypy suit desormais requirements.txt au
  # lieu d etre epinglee ici. C est la meme que celle de la CI, ce qui evite au
  # passage qu un ecart entre les deux ne se creuse en silence.
  # Cf. docs/DEV_SETUP.md, section « Windows — mypy bloque par Smart App Control ».
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # EXACTEMENT la commande de la CI, depuis le meme repertoire. Les deux ne
        # peuvent donc pas diverger : un type qui passe ici passe la-bas.
        #
        # `pass_filenames: false` est indispensable. Avec les fichiers passes un
        # par un depuis la racine du depot, mypy resout `backend.app.main` au
        # lieu de `app.main` et invente des erreurs — trois, mesurees le
        # 2026-08-04, dont un « FastAPI vs Module » qui n existe pas.
        # Meme idiome que les hooks prettier et eslint plus bas.
        entry: cmd /c "cd backend && .venv\Scripts\python -m mypy app/"
        language: system
        pass_filenames: false
        files: ^backend/app/.*\.py$

  # Python: security audit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-ll", "-r", "backend/app/"]
        files: ^backend/app/

  # Frontend: Prettier + ESLint (via npm scripts, compatibles Windows)
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: system
        entry: cmd /c "cd frontend && npm run format"
        files: ^frontend/src/.*\.(ts|html|scss)$
        pass_filenames: false

      - id: eslint
        name: eslint
        language: system
        entry: cmd /c "cd frontend && npm run lint -- --fix"
        files: ^frontend/src/.*\.ts$
        pass_filenames: false

  # Conventional commits
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, refactor, test, docs, chore, perf, ci, build]
