[pytest]
asyncio_mode = auto
pythonpath = tests

addopts =
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    # Releve de 82 a 90 le 2026-07-30 : la couverture reelle est a ~94 %, le
    # seuil laissait donc perdre douze points de tests sans que la CI bronche.
    # 90 verrouille l'acquis en gardant ~4 points de marge pour les variations
    # normales entre executions.
    --cov-fail-under=90
    --cov-config=.coveragerc
    --junit-xml=test-results/results.xml

testpaths = tests

[coverage:run]
source = app
omit =
    app/alembic/*
    app/core/database.py
    app/services/email_service.py
    app/services/newsletter_email.py
    app/services/scheduler.py
    app/services/stripe_service.py
    app/services/phishing_service.py
    app/services/phishing_templates.py
    app/services/public_scan_service.py
    app/services/quote_service.py
    app/api/v1/endpoints/webhooks.py

[coverage:report]
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    raise NotImplementedError
    \.\.\.
