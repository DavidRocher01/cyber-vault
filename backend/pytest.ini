[pytest]
asyncio_mode = auto
pythonpath = tests

addopts =
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    # Releve de 82 a 90 le 2026-07-30 : la couverture reelle est a ~94 %, le
    # seuil laissait donc perdre douze points de tests sans que la CI bronche.
    # 90 verrouille l'acquis en gardant ~4 points de marge pour les variations
    # normales entre executions.
    --cov-fail-under=90
    --cov-config=.coveragerc
    --junit-xml=test-results/results.xml

testpaths = tests

# NOTE — il n'y a PAS de section [coverage:run] ici.
#
# `--cov-config=.coveragerc` ci-dessus court-circuite toute configuration de
# couverture inscrite dans ce fichier. Il en existait une, avec onze exclusions
# de services (phishing, scan, public_scan, quote, webhooks...) : elle etait
# MORTE, et contredisait la politique reelle — `.coveragerc` a justement cesse
# d'exclure ces services le 2026-07-30, apres avoir constate qu'ils etaient
# invisibles et non pas a decouvert.
#
# Deux sources de verite dont une invisible : supprimee le 2026-08-03.
# La configuration de couverture vit dans `.coveragerc`, nulle part ailleurs.
